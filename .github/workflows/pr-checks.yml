name: Repository Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Next.js Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify browser storage isolation
        run: npm run test:storage:browser

      - name: Run production browser integration smoke
        run: npm run test:browser

      - name: Security Audit
        run: npm audit --audit-level=high
